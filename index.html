<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Puncak Booking - Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root" class="flex items-center justify-center h-screen">
        <div class="text-center p-8 bg-white rounded-2xl shadow-xl max-w-sm">
            <h1 class="text-2xl font-bold text-amber-600 mb-2">Villa Puncak</h1>
            <p class="text-slate-500">Memuat sistem manajemen penuh...</p>
        </div>
    </div>

    <script>
        // Redirect sederhana ke dashboard atau load konten utama
        window.onload = () => {
            document.getElementById('root').innerHTML = `
                <div class="p-8 text-center">
                    <h2 class="text-3xl font-bold text-slate-800">Selamat Datang di Villa Puncak</h2>
                    <p class="mt-4 text-slate-600">Sistem manajemen booking Anda sudah siap digunakan. 
                    Silakan login untuk mulai mengelola reservasi.</p>
                    <div class="mt-8 p-6 bg-amber-50 rounded-xl border border-amber-200">
                        <p class="font-bold text-amber-700">Fitur Tersedia:</p>
                        <ul class="mt-2 text-sm text-slate-600 space-y-1">
                            <li>✓ Kalender Booking</li>
                            <li>✓ Laporan Pengeluaran</li>
                            <li>✓ Invoice Otomatis</li>
                        </ul>
                    </div>
                </div>
            `;
        };
    </script>
</body>
</html>
