<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Booking Villa Puncak</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import React, { useState } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0';

        const Login = ({ onLogin }) => {
            const [user, setUser] = useState('');
            const [pass, setPass] = useState('');
            
            const handleLogin = (e) => {
                e.preventDefault();
                // Login sederhana untuk Pak Helmy
                if (user === 'admin' && pass === '123') {
                    onLogin({ user: 'Admin' });
                } else {
                    alert('Username/Password salah! Coba admin/123');
                }
            };

            return (
                <div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
                        <h1 class="text-2xl font-bold text-amber-600 mb-6 text-center">Login Villa Puncak</h1>
                        <form onSubmit={handleLogin} class="space-y-4">
                            <input type="text" placeholder="Username" class="w-full p-3 border rounded-lg" value={user} onChange={e=>setUser(e.target.value)} />
                            <input type="password" placeholder="Password" class="w-full p-3 border rounded-lg" value={pass} onChange={e=>setPass(e.target.value)} />
                            <button class="w-full bg-amber-500 text-white py-3 rounded-lg font-bold hover:bg-amber-600">Masuk</button>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [loggedIn, setLoggedIn] = useState(false);
            if (!loggedIn) return <Login onLogin={() => setLoggedIn(true)} />;
            return (
                <div class="p-10 text-center">
                    <h1 class="text-3xl font-bold text-slate-800">Selamat Datang di Sistem Villa!</h1>
                    <p class="mt-4 text-slate-600">Sistem sudah aktif dan siap digunakan untuk mengelola reservasi.</p>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
